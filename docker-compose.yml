services:
  analytics_dashboard:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install --include=dev && npm run build && NODE_ENV=production node server/index.js"
